<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{title}}</title>
<style>
  @media only screen and (max-width: 620px) {
    .card { width: 100% !important; }
    .px { padding-left: 22px !important; padding-right: 22px !important; }
    .btn a { display: block !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F6F3EE;-webkit-text-size-adjust:100%;">
<!-- Aperçu dans la boîte de réception (masqué dans le message) -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">{{preheader}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F6F3EE;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" class="card" width="570" cellpadding="0" cellspacing="0" border="0" style="width:570px;max-width:570px;">
        <!-- En-tête : logo -->
        <tr>
          <td align="center" style="padding:0 0 20px 0;font-family:'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
            <a href="{{homeUrl}}" style="text-decoration:none;color:#1A3A5B;font-size:20px;font-weight:700;">
              <img src="{{logoUrl}}" alt="{{brand}}" height="44" style="height:44px;width:auto;border:0;outline:none;vertical-align:middle;color:#1A3A5B;font-size:20px;font-weight:700;">
            </a>
          </td>
        </tr>
        <!-- Carte -->
        <tr>
          <td style="background-color:#FFFFFF;border:1px solid #E7E0D4;border-top:4px solid #1A3A5B;border-radius:14px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="px" style="padding:36px 40px 32px 40px;font-family:'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#16202E;">
                  <h1 style="margin:0 0 20px 0;font-family:'Bricolage Grotesque','DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.3;font-weight:800;color:#1A3A5B;letter-spacing:-0.3px;">{{title}}</h1>
                  {{body}}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Pied de page -->
        <tr>
          <td align="center" style="padding:24px 16px 0 16px;font-family:'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.7;color:#6B7585;">
            {{footer}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
