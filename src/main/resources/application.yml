spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: data-mastery-hub

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Mail (Gmail SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          debug: ${MAIL_SMTP_DEBUG:false}   # true : trace SMTP complete (affiche les identifiants en base64) - depannage local seulement
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: true
          starttls:
            enable: true
        from: ${MAIL_FROM:noreply@model-technologie.com}

# JWT
app:
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    enabled: true   # false en dev local
  masterclass:
    meet-link: ${MASTERCLASS_MEET_LINK:https://meet.google.com/xxx-xxxx-xxx}
  invoice:
    vat-percent: ${APP_INVOICE_VAT_PERCENT:0}          # non assujetti a la TVA
    seller:
      name: ${APP_INVOICE_SELLER_NAME:Model Technologie}
      address: "${APP_INVOICE_SELLER_ADDRESS:129 Liberté 6 extension}"
      phone: ${APP_INVOICE_SELLER_PHONE:+221 78 862 52 38}
      tax-id: ${APP_INVOICE_SELLER_TAX_ID:009775076}                  # NINEA
      register-number: "${APP_INVOICE_SELLER_REGISTER_NUMBER:SN DKR 2022 A 35655}"   # RCCM
      payment-details: "${APP_INVOICE_SELLER_PAYMENT_DETAILS:Wave : +221 78 862 52 38 | Orange Money : +221 78 862 52 38 | Virement (RIB) : SN012 01232 36213087001 80}"
      footer: "${APP_INVOICE_SELLER_FOOTER:TVA non applicable (entreprise non assujettie).}"
  auth:
    lockout:
      max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}   # echecs de mot de passe avant verrouillage
      minutes: ${AUTH_LOCKOUT_MINUTES:15}
    passwordless:
      minutes: ${AUTH_PASSWORDLESS_MINUTES:10}       # validite du lien / code de connexion
    google:
      client-id: ${GOOGLE_CLIENT_ID:}                # vide = connexion Google desactivee
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  mail:
    # Expediteur ; vide = le compte SMTP (Gmail impose la meme adresse, sauf alias declare)
    from: ${MAIL_FROM:}
    # Hors production : redirige TOUS les e-mails vers cette adresse (l'original est rappele dans l'objet)
    redirect-to: ${MAIL_REDIRECT_TO:}
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    retry-delay-ms: ${MAIL_RETRY_DELAY_MS:2000}
    log-retention-days: ${MAIL_LOG_RETENTION_DAYS:90}
  notifications:
    phone:
      to: ${NOTIFICATION_PHONE_TO:788625238}
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      bootcamp-subscription-webhook-url: ${SLACK_BOOTCAMP_SUBSCRIPTION_WEBHOOK_URL:}
    email:
      to: ${NOTIFICATION_EMAIL_TO:business.modeltech@gmail.com}

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}     # réseau interne Docker
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000} # accessible depuis le browser
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:media}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tags-sorter: alpha

# Ajouter cette section
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never