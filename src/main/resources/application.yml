spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: data-mastery-hub

  servlet:
    multipart:
      # Plafond technique ; chaque endpoint applique sa propre limite (images 5 Mo, preuve de paiement, fichiers du projet final)
      # et UploadSizeFilter refuse tôt, selon la route, les requêtes manifestement trop lourdes.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:105MB}

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Mail (Gmail SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          debug: ${MAIL_SMTP_DEBUG:false}   # true : trace SMTP complete (affiche les identifiants en base64) - depannage local seulement
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: true
          starttls:
            enable: true
        from: ${MAIL_FROM:noreply@model-technologie.com}

# JWT
app:
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    enabled: true   # false en dev local
    # Domaines du site autorises dans la reponse de Google (ex. model-technologie.com,www.model-technologie.com) ; vide = pas de controle
    allowed-hostnames: ${RECAPTCHA_ALLOWED_HOSTNAMES:}
  masterclass:
    meet-link: ${MASTERCLASS_MEET_LINK:https://meet.google.com/xxx-xxxx-xxx}
  invoice:
    vat-percent: ${APP_INVOICE_VAT_PERCENT:0}          # non assujetti a la TVA
    seller:
      name: ${APP_INVOICE_SELLER_NAME:Model Technologie}
      address: "${APP_INVOICE_SELLER_ADDRESS:129 Liberté 6 extension}"
      phone: ${APP_INVOICE_SELLER_PHONE:+221 78 862 52 38}
      tax-id: ${APP_INVOICE_SELLER_TAX_ID:009775076}                  # NINEA
      register-number: "${APP_INVOICE_SELLER_REGISTER_NUMBER:SN DKR 2022 A 35655}"   # RCCM
      payment-details: "${APP_INVOICE_SELLER_PAYMENT_DETAILS:Wave : +221 78 862 52 38 | Orange Money : +221 78 862 52 38 | Virement (RIB) : SN012 01232 36213087001 80}"
      footer: "${APP_INVOICE_SELLER_FOOTER:TVA non applicable (entreprise non assujettie).}"
  auth:
    lockout:
      # Echecs de mot de passe sur un MEME compte (toutes IP confondues) avant verrouillage ; le frein principal est
      # le couple (e-mail, IP) ci-dessous. Eleve pour qu'un tiers ne puisse pas verrouiller le compte d'un administrateur.
      max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:20}
      minutes: ${AUTH_LOCKOUT_MINUTES:15}
    throttle:
      max-attempts: ${AUTH_THROTTLE_MAX_ATTEMPTS:5}   # echecs par couple (e-mail, IP) avant blocage de ce couple
      minutes: ${AUTH_THROTTLE_MINUTES:15}
    password:
      min-length-staff: ${AUTH_PASSWORD_MIN_STAFF:12}
      min-length-learner: ${AUTH_PASSWORD_MIN_LEARNER:10}
    mfa:
      enforced: ${AUTH_MFA_ENFORCED:true}   # double authentification obligatoire pour le personnel ; ne desactiver qu'en local
      issuer: ${AUTH_MFA_ISSUER:Model Technologie}
      # 32 octets en Base64 (openssl rand -base64 32) : chiffre les secrets TOTP en base. OBLIGATOIRE en staging/production,
      # a conserver hors du depot ; ne pas la changer (les secrets deja enregistres deviendraient illisibles).
      encryption-key: ${MFA_ENCRYPTION_KEY:}
      challenge-minutes: ${AUTH_MFA_CHALLENGE_MINUTES:5}
    refresh:
      staff-idle-hours: ${AUTH_REFRESH_STAFF_IDLE_HOURS:8}
      staff-max-days: ${AUTH_REFRESH_STAFF_MAX_DAYS:7}
      learner-idle-days: ${AUTH_REFRESH_LEARNER_IDLE_DAYS:14}
      learner-max-days: ${AUTH_REFRESH_LEARNER_MAX_DAYS:60}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}      # false uniquement en developpement local (HTTP)
      same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    passwordless:
      minutes: ${AUTH_PASSWORDLESS_MINUTES:10}       # validite du lien / code de connexion
    google:
      client-id: ${GOOGLE_CLIENT_ID:}                # vide = connexion Google desactivee
  jwt:
    secret: ${JWT_SECRET}
    # Ancien secret, accepte en lecture pendant une rotation de cle (laisser vide hors rotation)
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    # Jeton d'acces : 15 minutes ; la session se prolonge par le cookie de rafraichissement (app.auth.refresh.*)
    expiration: ${JWT_EXPIRATION:900000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  mail:
    # Expediteur ; vide = le compte SMTP (Gmail impose la meme adresse, sauf alias declare)
    from: ${MAIL_FROM:}
    # Nom affiche a cote de l'adresse dans la boite de reception (« Model Technologie <noreply@...> »)
    from-name: ${MAIL_FROM_NAME:Model Technologie}
    # Hors production : redirige TOUS les e-mails vers cette adresse (l'original est rappele dans l'objet)
    redirect-to: ${MAIL_REDIRECT_TO:}
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    retry-delay-ms: ${MAIL_RETRY_DELAY_MS:2000}
    log-retention-days: ${MAIL_LOG_RETENTION_DAYS:90}
  notifications:
    phone:
      to: ${NOTIFICATION_PHONE_TO:788625238}
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      bootcamp-subscription-webhook-url: ${SLACK_BOOTCAMP_SUBSCRIPTION_WEBHOOK_URL:}
    email:
      to: ${NOTIFICATION_EMAIL_TO:business.modeltech@gmail.com}

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}     # réseau interne Docker
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000} # accessible depuis le browser
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:media}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tags-sorter: alpha

# Ajouter cette section
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never