name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Les tests d'intégration utilisent Testcontainers : Docker est disponible sur ubuntu-latest
      - name: Compiler et tester
        run: ./mvnw -B -ntp verify

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
