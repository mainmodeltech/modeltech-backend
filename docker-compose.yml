services:

  db:
    image: postgres:15-alpine
    container_name: modeltech_prod_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modeltech_prod_backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY est obligatoire (openssl rand -base64 32)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_BOOTCAMP_SUBSCRIPTION_WEBHOOK_URL: ${SLACK_BOOTCAMP_SUBSCRIPTION_WEBHOOK_URL}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO}
      NOTIFICATION_PHONE_TO: ${NOTIFICATION_PHONE_TO}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_HOST: ${MAIL_HOST}
      MASTERCLASS_MEET_LINK: ${MASTERCLASS_MEET_LINK}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      RECAPTCHA_ALLOWED_HOSTNAMES: ${RECAPTCHA_ALLOWED_HOSTNAMES:-}
      # Paiement en ligne du simulateur (PayDunya). Cles vides = achat en ligne desactive (aucun bouton « Acheter »).
      # Les trois cles doivent etre du MEME mode que PAYDUNYA_MODE : cles de test avec « sandbox », cles de production avec « live ».
      PAYDUNYA_MODE: ${PAYDUNYA_MODE:-sandbox}
      PAYDUNYA_MASTER_KEY: ${PAYDUNYA_MASTER_KEY:-}
      PAYDUNYA_PRIVATE_KEY: ${PAYDUNYA_PRIVATE_KEY:-}
      PAYDUNYA_TOKEN: ${PAYDUNYA_TOKEN:-}
      PAYDUNYA_STORE_NAME: ${PAYDUNYA_STORE_NAME:-Model Technologie}
      # Adresse de notification (IPN) declaree chez PayDunya, ex. https://api.model-technologie.com/api/v1/payments/paydunya/ipn
      PAYDUNYA_CALLBACK_URL: ${PAYDUNYA_CALLBACK_URL:-}
      # Frais du prestataire : ABSORB (defaut, les prix du catalogue les absorbent) ou PASS_ON (repercutes au client, paiement en ligne seulement)
      PAYMENTS_FEES_MODE: ${PAYMENTS_FEES_MODE:-ABSORB}
      PAYMENTS_FEES_PERCENT: ${PAYMENTS_FEES_PERCENT:-0}
      PAYMENTS_FEES_FIXED_XOF: ${PAYMENTS_FEES_FIXED_XOF:-0}
      # Coaching : lien de reservation d'un echange de presentation (15 a 20 min, vide = non propose) et destinataires internes des alertes (vide = adresse generale)
      COACHING_BOOKING_URL: ${COACHING_BOOKING_URL:-}
      COACHING_NOTIFY_TO: ${COACHING_NOTIFY_TO:-}
    depends_on:
      - db
      - minio
    networks:
      - dokploy-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: modeltech_prod_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Indique à MinIO son URL publique (important pour les redirections S3)
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_DOMAIN}
      MINIO_SERVER_URL: https://${MINIO_PUBLIC_DOMAIN}
    volumes:
      - minio_data:/data
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  dokploy-network:
    external: true
