services:

  db-staging:
    image: postgres:15-alpine
    container_name: modeltech_staging_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: unless-stopped

  backend-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modeltech_staging_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-staging}
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db-staging:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # 64 octets minimum (openssl rand -base64 64) : plus court, aucune connexion ne fonctionne
      JWT_SECRET: ${JWT_SECRET}
      # Origine(s) du front staging, separees par des virgules (ex. https://staging.model-technologie.com)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # URL publique du front staging : base des liens des e-mails (paiement, mot de passe, certificat).
      # Sans elle les liens pointent vers http://localhost:5173.
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?APP_FRONTEND_URL est obligatoire (URL publique du front staging)}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Dakar}
      # ← réseau interne Docker : le backend contacte MinIO par son nom de service
      MINIO_ENDPOINT: http://minio-staging:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOOTCAMP_SUBSCRIPTION_WEBHOOK_URL: ${SLACK_BOOTCAMP_SUBSCRIPTION_WEBHOOK_URL:-}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO}
      NOTIFICATION_PHONE_TO: ${NOTIFICATION_PHONE_TO:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Staging : redirige TOUS les e-mails vers cette adresse de recette (evite d'ecrire a de vrais candidats)
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      MASTERCLASS_MEET_LINK: ${MASTERCLASS_MEET_LINK:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      # Connexion Google (ID client OAuth Web) ; vide = bouton masque
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - db-staging
      - minio-staging
    networks:
      - dokploy-network
    restart: unless-stopped

  minio-staging:
    # minio/minio n'est plus publie sur Docker Hub : build communautaire Chainguard (inclut aussi `mc`)
    image: cgr.dev/chainguard/minio:latest
    container_name: modeltech_minio_staging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Indique à MinIO son URL publique (important pour les redirections S3)
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_DOMAIN}
      MINIO_SERVER_URL: https://${MINIO_PUBLIC_DOMAIN}
    volumes:
      - minio_data:/data
    networks:
      - dokploy-network
    restart: unless-stopped

  # Cree le bucket et applique la lecture anonyme limitee aux images publiques (logos, photos, visuels de projets).
  # Les justificatifs de paiement et les rendus d'apprenants restent prives (liens signes).
  # Idempotent : sans lui, tous les envois de fichiers echouent ("The specified bucket does not exist").
  minio-init-staging:
    image: cgr.dev/chainguard/minio:latest
    container_name: modeltech_minio_init_staging
    depends_on:
      - minio-staging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio-staging:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "MinIO pas encore pret..."; sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        # Lecture anonyme LIMITEE aux images publiques (jamais `mc anonymous set public` : il ouvre aussi
        # la liste, l'ecriture et la suppression). Meme liste que scripts/minio/apply-public-policy.sh.
        cat > /tmp/public-read-policy.json <<POLICY
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET/alumni/*","arn:aws:s3:::$$MINIO_BUCKET/partners/*","arn:aws:s3:::$$MINIO_BUCKET/projects/screenshots/*","arn:aws:s3:::$$MINIO_BUCKET/projects/covers/*"]}]}
        POLICY
        mc anonymous set-json /tmp/public-read-policy.json "local/$$MINIO_BUCKET"
    networks:
      - dokploy-network
    restart: "no"


volumes:
  postgres_data:
  minio_data:

networks:
  dokploy-network:
    external: true
